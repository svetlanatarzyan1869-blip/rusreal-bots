# Выкладка сайта на GitHub Pages.
# Главное отличие от стандартной: идущая выкладка НЕ отменяется новым коммитом.
# Новые коммиты (боты из формы) ждут в очереди, и сразу после текущей выкладки
# уходит одна свежая — со всем, что накопилось. Сайт больше не «застревает».
name: Выкладка сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
